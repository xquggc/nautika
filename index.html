<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>咕咕服PVE工具</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.78);
      --panel-2: rgba(30, 41, 59, 0.82);
      --line: rgba(148, 163, 184, 0.24);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --warn: #f59e0b;
      --chip: rgba(56, 189, 248, 0.12);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 8%, rgba(56, 189, 248, 0.22), transparent 28%),
        radial-gradient(circle at 85% 18%, rgba(34, 197, 94, 0.16), transparent 30%),
        linear-gradient(135deg, #020617 0%, #0f172a 48%, #111827 100%);
      padding: 28px;
    }

    .app { max-width: 1360px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-end;
      margin-bottom: 18px;
    }

    .title-wrap h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 4vw, 48px);
      letter-spacing: -0.05em;
      line-height: 1.05;
    }

    .title-wrap p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      max-width: 860px;
      line-height: 1.7;
    }

    .badge {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.55);
      border-radius: 999px;
      padding: 10px 14px;
      color: #bae6fd;
      font-size: 13px;
      box-shadow: var(--shadow);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .tab {
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.58);
      border-radius: 18px;
      padding: 16px;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 12px 34px rgba(0,0,0,0.18);
    }

    .tab.active {
      border-color: rgba(56, 189, 248, 0.72);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(34, 197, 94, 0.10));
    }

    .tab .name {
      font-size: 18px;
      font-weight: 850;
      margin-bottom: 6px;
    }

    .tab .desc {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .control {
      padding: 22px;
      position: sticky;
      top: 20px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.85);
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin: 15px 0 8px;
    }

    select, input {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.34);
      border-radius: 14px;
      background: rgba(2, 6, 23, 0.7);
      color: var(--text);
      padding: 13px 14px;
      font-size: 15px;
      outline: none;
    }

    select:focus, input:focus {
      border-color: rgba(56, 189, 248, 0.85);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.12);
    }

    .quick-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .owned-help {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      margin: -4px 0 10px;
    }

    .owned-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .owned-row {
      display: grid;
      grid-template-columns: 1fr 84px 38px;
      gap: 8px;
      align-items: center;
    }

    .owned-row select,
    .owned-row input {
      padding: 10px 10px;
      font-size: 13px;
      border-radius: 12px;
    }

    .owned-row button {
      padding: 10px 0;
      color: #fecdd3;
      border-color: rgba(251, 113, 133, 0.28);
    }

    .owned-tools {
      display: grid;
      grid-template-columns: 1fr 86px;
      gap: 8px;
      margin-top: 10px;
    }

    .owned-empty {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      padding: 10px 12px;
      border: 1px dashed rgba(148, 163, 184, 0.28);
      border-radius: 14px;
      background: rgba(2, 6, 23, 0.24);
    }

    .deducted-note {
      margin: 0 0 12px;
      padding: 10px 12px;
      border: 1px solid rgba(34, 197, 94, 0.28);
      background: rgba(34, 197, 94, 0.09);
      color: #bbf7d0;
      border-radius: 14px;
      font-size: 12px;
      line-height: 1.7;
    }


    button {
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.75);
      color: var(--text);
      padding: 10px 8px;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(56, 189, 248, 0.7);
      background: rgba(56, 189, 248, 0.14);
    }

    .summary {
      margin-top: 18px;
      padding: 15px;
      border-radius: 16px;
      background: rgba(2, 6, 23, 0.48);
      border: 1px solid var(--line);
      color: var(--muted);
      line-height: 1.7;
      font-size: 13px;
    }

    .summary strong {
      color: #f8fafc;
      font-weight: 700;
    }

    .formula-list {
      margin-top: 18px;
      max-height: 44vh;
      overflow: auto;
      padding-right: 4px;
    }

    .formula-item {
      padding: 11px 12px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(15, 23, 42, 0.62);
      border-radius: 14px;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.55;
    }

    .formula-item b {
      color: #e0f2fe;
      font-size: 13px;
    }

    .results {
      padding: 22px;
      min-height: 640px;
    }

    .top-result {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 15px;
      background: rgba(2, 6, 23, 0.42);
    }

    .stat .num {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .stat .name {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .notice {
      padding: 13px 15px;
      border: 1px solid rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.11);
      color: #fde68a;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .toolbar input {
      max-width: 360px;
      padding: 10px 12px;
      font-size: 13px;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    details.scheme {
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 18px;
      overflow: hidden;
    }

    details.scheme[open] {
      border-color: rgba(56, 189, 248, 0.42);
    }

    .scheme summary {
      cursor: pointer;
      list-style: none;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 86px 1fr auto;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid transparent;
    }

    details.scheme[open] summary {
      border-bottom-color: var(--line);
      background: rgba(2, 6, 23, 0.28);
    }

    .scheme summary::-webkit-details-marker { display: none; }

    .scheme-no {
      font-weight: 800;
      color: #e0f2fe;
    }

    .route-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .chip {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      border-radius: 999px;
      padding: 5px 8px;
      background: var(--chip);
      border: 1px solid rgba(56, 189, 248, 0.22);
      color: #bae6fd;
      font-size: 12px;
      line-height: 1;
    }

    .chip strong {
      font-weight: 800;
      color: #f8fafc;
    }

    .mini-materials {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .scheme-body {
      padding: 14px 16px 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      overflow: hidden;
      border-radius: 14px;
    }

    th, td {
      text-align: left;
      padding: 11px 12px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      vertical-align: top;
    }

    th {
      color: #cbd5e1;
      background: rgba(2, 6, 23, 0.38);
      font-size: 12px;
      letter-spacing: 0.03em;
    }

    td.qty {
      font-weight: 800;
      color: #f8fafc;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    tr:last-child td { border-bottom: none; }

    .group-title {
      margin: 18px 0 10px;
      font-size: 14px;
      font-weight: 800;
      color: #bbf7d0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .group-title::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-2);
    }

    .empty {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed rgba(148, 163, 184, 0.3);
      border-radius: 20px;
      line-height: 1.8;
    }

    .error {
      padding: 15px;
      border-radius: 16px;
      border: 1px solid rgba(251, 113, 133, 0.45);
      background: rgba(251, 113, 133, 0.1);
      color: #fecdd3;
      line-height: 1.7;
    }

    .small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      margin-top: 10px;
    }

    @media (max-width: 1060px) {
      body { padding: 18px; }
      header { display: block; }
      .badge { display: inline-block; margin-top: 14px; }
      .grid { grid-template-columns: 1fr; }
      .control { position: static; }
      .top-result { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 720px) {
      .tabs { grid-template-columns: 1fr; }
      .top-result { grid-template-columns: 1fr; }
      .scheme summary {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      th:nth-child(3), td:nth-child(3) { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-wrap">
        <h1>咕咕服PVE工具</h1>
      </div>
    </header>

    <main class="grid">
      <aside class="panel control">
        <h2 class="section-title" id="panelTitle">材料计算</h2>

        <label for="faction">选择势力</label>
        <select id="faction"></select>

        <label for="target">选择该势力下要合成的材料</label>
        <select id="target"></select>

        <label for="amount">需要数量</label>
        <input id="amount" type="number" min="0" step="1" value="1" />

        <div class="quick-row">
          <button type="button" data-quick="1">1</button>
          <button type="button" data-quick="5">5</button>
          <button type="button" data-quick="10">10</button>
          <button type="button" data-quick="64">64</button>
        </div>

        <h2 class="section-title" style="margin-top:20px;">已有材料</h2>
        <div class="owned-help">可添加你仓库里已有的高级材料或基础材料。计算时会先抵扣已有材料，再展开剩余需求。</div>
        <div class="owned-list" id="ownedList"></div>
        <div class="owned-tools">
          <button type="button" id="addOwnedBtn">添加已有材料</button>
          <button type="button" id="clearOwnedBtn">清空</button>
        </div>

        <div class="summary" id="summary"></div>

        <div class="small" id="aliasNote"></div>
      </aside>

      <section class="panel results">
        <div class="top-result" id="stats"></div>
        <div id="output"></div>
      </section>
    </main>
  </div>

    const factionEl = document.getElementById("faction");
    const targetEl = document.getElementById("target");
    const amountEl = document.getElementById("amount");
    const outputEl = document.getElementById("output");
    const statsEl = document.getElementById("stats");
    const summaryEl = document.getElementById("summary");
    const formulaListEl = document.getElementById("formulaList");
    const ownedListEl = document.getElementById("ownedList");
    const addOwnedBtn = document.getElementById("addOwnedBtn");
    const clearOwnedBtn = document.getElementById("clearOwnedBtn");
    const panelTitleEl = document.getElementById("panelTitle");
    const aliasNoteEl = document.getElementById("aliasNote");

    let activeTableKey = "hunter";
    let activeData = null;
    let activeRecipes = {};
    let activeBaseMaterials = [];
    let ownedRowsByTable = {};

    const normalizeName = (name) => ALIASES[name] || name;

    const fmt = (num) => {
      const rounded = Math.round((num + Number.EPSILON) * 10000) / 10000;
      return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
    };

    const mergeMaterials = (a, b) => {
      const out = { ...a };
      Object.entries(b).forEach(([k, v]) => {
        out[k] = (out[k] || 0) + v;
      });
      return out;
    };

    function getCurrentRecipes() {
      return {
        ...SHARED_RECIPES,
        ...TABLES[activeTableKey].recipes
      };
    }

    function getCurrentBaseMaterials() {
      const fromTable = TABLES[activeTableKey].baseMaterials;
      return Array.from(new Set(fromTable));
    }


    function getAllMaterialOptions() {
      const names = [
        ...Object.keys(activeData.recipes),
        ...Object.keys(activeRecipes),
        ...activeBaseMaterials
      ].map(normalizeName);

      return Array.from(new Set(names)).sort((a, b) => a.localeCompare(b, "zh-Hans-CN"));
    }

    function saveOwnedRows() {
      if (!activeTableKey || !ownedListEl) return;

      const rows = Array.from(ownedListEl.querySelectorAll(".owned-row")).map(row => {
        const name = normalizeName(row.querySelector(".owned-material")?.value || "");
        const qty = Number(row.querySelector(".owned-qty")?.value || 0);
        return { name, qty };
      }).filter(row => row.name && row.qty > 0);

      ownedRowsByTable[activeTableKey] = rows;
    }

    function renderOwnedRows() {
      const rows = ownedRowsByTable[activeTableKey] || [];
      const options = getAllMaterialOptions();

      if (!rows.length) {
        ownedListEl.innerHTML = `<div class="owned-empty">暂无已有材料。点击“添加已有材料”后，可选择材料并填写数量。</div>`;
        return;
      }

      ownedListEl.innerHTML = rows.map((row, index) => {
        const optionHtml = options.map(name => {
          const selected = name === row.name ? "selected" : "";
          return `<option value="${name}" ${selected}>${name}</option>`;
        }).join("");

        return `
          <div class="owned-row" data-index="${index}">
            <select class="owned-material">${optionHtml}</select>
            <input class="owned-qty" type="number" min="0" step="1" value="${fmt(row.qty)}" />
            <button type="button" class="owned-remove" title="删除">×</button>
          </div>
        `;
      }).join("");
    }

    function addOwnedRow() {
      saveOwnedRows();
      const options = getAllMaterialOptions();
      const rows = ownedRowsByTable[activeTableKey] || [];
      rows.push({ name: options[0] || "", qty: 1 });
      ownedRowsByTable[activeTableKey] = rows;
      renderOwnedRows();
      renderOutput();
    }

    function clearOwnedRows() {
      ownedRowsByTable[activeTableKey] = [];
      renderOwnedRows();
      renderOutput();
    }

    function getOwnedMaterials() {
      saveOwnedRows();

      const owned = {};
      (ownedRowsByTable[activeTableKey] || []).forEach(row => {
        const name = normalizeName(row.name);
        const qty = Number(row.qty || 0);
        if (name && qty > 0) {
          owned[name] = (owned[name] || 0) + qty;
        }
      });

      return owned;
    }

    function cloneMaterials(materials) {
      return { ...materials };
    }

    function isBase(name) {
      return activeBaseMaterials.includes(normalizeName(name));
    }

    const materialKey = (materials) => {
      return activeBaseMaterials
        .map(name => `${name}:${fmt(materials[name] || 0)}`)
        .join("|");
    };

    const routeKey = (routes) => {
      return Object.keys(routes).sort().map(k => `${k}:${routes[k]}`).join("|");
    };

    function findReachableMultiMaterials(rawName, visited = new Set()) {
      const name = normalizeName(rawName);

      if (isBase(name) || !activeRecipes[name] || visited.has(name)) {
        return new Set();
      }

      visited.add(name);

      const found = new Set();
      if (activeRecipes[name].length > 1) {
        found.add(name);
      }

      activeRecipes[name].forEach(recipe => {
        recipe.items.forEach(([child]) => {
          findReachableMultiMaterials(child, visited).forEach(item => found.add(item));
        });
      });

      return found;
    }

    function cartesianChoice(materialNames, index = 0, current = {}, out = []) {
      if (index >= materialNames.length) {
        out.push({ ...current });
        return out;
      }

      const name = materialNames[index];
      activeRecipes[name].forEach((_, recipeIndex) => {
        current[name] = recipeIndex;
        cartesianChoice(materialNames, index + 1, current, out);
      });

      delete current[name];
      return out;
    }

    function mergeDeducted(a, b) {
      const out = { ...a };
      Object.entries(b).forEach(([k, v]) => {
        out[k] = (out[k] || 0) + v;
      });
      return out;
    }

    function consumeOwned(name, qty, owned) {
      const available = owned[name] || 0;
      const used = Math.min(qty, available);

      if (used > 0) {
        owned[name] = available - used;
        if (owned[name] <= 0.0000001) delete owned[name];
      }

      return {
        remaining: qty - used,
        deducted: used > 0 ? { [name]: used } : {}
      };
    }

    function expandWithGlobalChoices(rawName, qty, choices, stack = [], owned = {}) {
      const name = normalizeName(rawName);

      if (qty === 0) {
        return { materials: {}, routes: {}, deducted: {} };
      }

      const consumed = consumeOwned(name, qty, owned);
      const remainingQty = consumed.remaining;

      if (remainingQty <= 0.0000001) {
        return { materials: {}, routes: {}, deducted: consumed.deducted };
      }

      if (isBase(name) || !activeRecipes[name]) {
        return {
          materials: { [name]: remainingQty },
          routes: {},
          deducted: consumed.deducted
        };
      }

      if (stack.includes(name)) {
        throw new Error(`检测到循环配方：${stack.concat(name).join(" → ")}`);
      }

      const recipes = activeRecipes[name];
      const recipeIndex = recipes.length > 1 ? (choices[name] ?? 0) : 0;
      const recipe = recipes[recipeIndex];

      let materials = {};
      let routes = {};
      let deducted = { ...consumed.deducted };

      if (recipes.length > 1) {
        routes[name] = recipe.label;
      }

      recipe.items.forEach(([ingredientName, ingredientQty]) => {
        const sub = expandWithGlobalChoices(ingredientName, ingredientQty * remainingQty, choices, stack.concat(name), owned);
        materials = mergeMaterials(materials, sub.materials);
        routes = { ...routes, ...sub.routes };
        deducted = mergeDeducted(deducted, sub.deducted);
      });

      return { materials, routes, deducted };
    }

    function computeMergedResults(target, amount, ownedMaterials = {}) {
      const multiMaterials = Array.from(findReachableMultiMaterials(target));
      const choicesList = multiMaterials.length ? cartesianChoice(multiMaterials) : [{}];

      const map = new Map();

      choicesList.forEach(choices => {
        const ownedCopy = cloneMaterials(ownedMaterials);
        const expanded = expandWithGlobalChoices(target, amount, choices, [], ownedCopy);
        const key = materialKey(expanded.materials) + "##" + routeKey(expanded.routes);

        if (!map.has(key)) {
          map.set(key, {
            materials: expanded.materials,
            routes: expanded.routes,
            deducted: expanded.deducted
          });
        }
      });

      return Array.from(map.values()).sort((a, b) => {
        const aRoute = routeKey(a.routes);
        const bRoute = routeKey(b.routes);
        return aRoute.localeCompare(bRoute, "zh-Hans-CN");
      });
    }

    function routeLabel(routes) {
      const names = Object.keys(routes);
      if (!names.length) return "标准单路线";
      return names.map(name => `${name}：${routes[name]}`).join("；");
    }

    function miniMaterials(materials) {
      const active = activeBaseMaterials
        .filter(name => (materials[name] || 0) > 0)
        .map(name => `${name}${fmt(materials[name])}`);
      if (!active.length) return "无需新增基础材料";
      return active.slice(0, 5).join(" / ") + (active.length > 5 ? ` / 等${active.length}种` : "");
    }

    function primaryGroupKey(result) {
      const priority = ["教会嘉奖令", "地狱魔力矿", "地外提纯矿物", "未知的金属矿粒"];
      for (const name of priority) {
        if (result.routes[name]) return `${name}：${result.routes[name]}`;
      }
      if (Object.keys(result.routes).length) {
        return routeLabel(result.routes);
      }
      return "标准单路线";
    }

    function renderFactionOptions() {
      factionEl.innerHTML = Object.entries(TABLES).map(([key, data]) => {
        const selected = key === activeTableKey ? "selected" : "";
        return `<option value="${key}" ${selected}>${data.title}</option>`;
      }).join("");
    }

    function renderTargetOptions() {
      targetEl.innerHTML = "";
      Object.keys(activeData.recipes).forEach(name => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        targetEl.appendChild(option);
      });
      targetEl.value = activeData.defaultTarget;
    }

    function renderFormulas() {
      if (!formulaListEl) return;
      const ownRecipes = activeData.recipes;
      const sharedUsed = Object.keys(SHARED_RECIPES).filter(name => {
        return JSON.stringify(ownRecipes).includes(name);
      });

      const formulaBlocks = [];

      Object.keys(ownRecipes).forEach(name => {
        formulaBlocks.push(renderOneFormula(name, ownRecipes[name]));
      });

      sharedUsed.forEach(name => {
        formulaBlocks.push(renderOneFormula(name, SHARED_RECIPES[name], "通用配方"));
      });

      formulaListEl.innerHTML = formulaBlocks.join("");
    }

    function renderOneFormula(name, recipes, tag = "") {
      const recipesHtml = recipes.map(recipe => {
        const rhs = recipe.items.map(([n, q]) => `${fmt(q)}个${normalizeName(n)}`).join(" + ");
        return `<div>${recipes.length > 1 ? `<b>${recipe.label}</b>：` : ""}1个${name} = ${rhs}</div>`;
      }).join("");
      return `<div class="formula-item"><b>${name}</b>${tag ? ` <span style="color:#94a3b8">· ${tag}</span>` : ""}${recipesHtml}</div>`;
    }

    function renderStats(results, amount, target) {
      let maxTotalKinds = 0;

      results.forEach(result => {
        maxTotalKinds = Math.max(maxTotalKinds, Object.values(result.materials).filter(v => v > 0).length);
      });

      statsEl.innerHTML = [
        ["目标数量", `${fmt(amount)} 个`, target],
        ["合并方案", `${results.length} 种`, "同一多配方材料全局合并"],
        ["材料种类", `${maxTotalKinds} 种`, "按最多方案统计"]
      ].map(([name, num, sub]) => `
        <div class="stat">
          <div class="num">${num}</div>
          <div class="name">${name} · ${sub}</div>
        </div>
      `).join("");
    }

    function materialRows(materials) {
      const rows = activeBaseMaterials
        .filter(name => (materials[name] || 0) > 0)
        .map(name => {
          let type = "基础材料";
          if (activeData.primaryBaseMaterials && activeData.primaryBaseMaterials.includes(name)) {
            type = "阿斯兰基础材料";
          }
          if (activeData.sharedBaseMaterials && activeData.sharedBaseMaterials.includes(name)) {
            type = "通用配方基础材料";
          }
          if (name === "绿券") type = "由泰拉能量棒换算";
          return `
            <tr>
              <td>${name}</td>
              <td class="qty">${fmt(materials[name])}</td>
              <td>${type}</td>
            </tr>
          `;
        }).join("");

      return rows || `<tr><td colspan="3">已有材料已完全覆盖，本方案无需新增基础材料。</td></tr>`;
    }

    function deductedSummary(deducted) {
      const entries = Object.entries(deducted || {}).filter(([, qty]) => qty > 0);
      if (!entries.length) return "";
      return entries.map(([name, qty]) => `${name}${fmt(qty)}`).join(" / ");
    }

    function deductedBlock(deducted) {
      const summary = deductedSummary(deducted);
      if (!summary) return "";
      return `<div class="deducted-note">已抵扣已有材料：${summary}</div>`;
    }

    function schemeItem(result, index) {
      const routeChips = Object.keys(result.routes).length
        ? Object.entries(result.routes).map(([name, route]) => `<span class="chip"><strong>${name}</strong>${route}</span>`).join("")
        : `<span class="chip"><strong>路线</strong>标准单路线</span>`;

      return `
        <details class="scheme" data-search="${routeLabel(result.routes)} ${miniMaterials(result.materials)} ${deductedSummary(result.deducted)}">
          <summary>
            <div class="scheme-no">方案 ${index}</div>
            <div class="route-line">${routeChips}</div>
            <div class="mini-materials">${miniMaterials(result.materials)}</div>
          </summary>
          <div class="scheme-body">
            ${deductedBlock(result.deducted)}
            <table>
              <thead>
                <tr>
                  <th>基础材料</th>
                  <th>需要数量</th>
                  <th>说明</th>
                </tr>
              </thead>
              <tbody>${materialRows(result.materials)}</tbody>
            </table>
          </div>
        </details>
      `;
    }

    function renderList(results) {
      const grouped = new Map();

      results.forEach(result => {
        const key = primaryGroupKey(result);
        if (!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push(result);
      });

      let index = 1;
      let html = "";

      grouped.forEach((groupResults, groupName) => {
        html += `<div class="group-title">${groupName}</div>`;
        html += `<div class="list">`;
        groupResults.forEach(result => {
          html += schemeItem(result, index++);
        });
        html += `</div>`;
      });

      return html;
    }

    function bindSearch() {
      const searchEl = document.getElementById("schemeSearch");
      if (!searchEl) return;

      searchEl.addEventListener("input", () => {
        const keyword = searchEl.value.trim().toLowerCase();
        document.querySelectorAll("details.scheme").forEach(item => {
          const haystack = item.dataset.search.toLowerCase();
          item.style.display = !keyword || haystack.includes(keyword) ? "" : "none";
        });
      });
    }

    function bindAccordion() {
      document.querySelectorAll("details.scheme").forEach(item => {
        item.addEventListener("toggle", () => {
          if (!item.open) return;

          document.querySelectorAll("details.scheme").forEach(other => {
            if (other !== item) {
              other.open = false;
            }
          });
        });
      });
    }

    function renderOutput() {
      const target = targetEl.value;
      const amount = Number(amountEl.value);

      if (!target || Number.isNaN(amount) || amount <= 0) {
        statsEl.innerHTML = "";
        outputEl.innerHTML = `<div class="empty">请输入大于 0 的目标数量。</div>`;
        summaryEl.innerHTML = "等待输入目标材料数量。";
        return;
      }

      try {
        const ownedMaterials = getOwnedMaterials();
        const results = computeMergedResults(target, amount, ownedMaterials);
        renderStats(results, amount, target);

        const reachableMulti = Array.from(findReachableMultiMaterials(target));
        const ownedEntries = Object.entries(ownedMaterials).filter(([, qty]) => qty > 0);
        const ownedText = ownedEntries.length
          ? ownedEntries.map(([name, qty]) => `${name}${fmt(qty)}`).join("、")
          : "无";

        summaryEl.innerHTML = `
          当前势力：<strong>${activeData.title}</strong><br>
          当前计算：<strong>${fmt(amount)} 个 ${target}</strong><br>
          合并规则：同一种多配方材料在一个方案中只选择一种路线。<br>
          已有材料：${ownedText}<br>
          本次涉及多配方材料：${reachableMulti.length ? reachableMulti.join("、") : "无"}
        `;

        const notice = `
          <div class="notice">
            已将可合并的方案压缩成列表，并会先抵扣你填写的已有材料。点击每个方案可展开查看基础材料明细；
            搜索框可按路线、材料名或已抵扣材料快速筛选。
          </div>
          <div class="toolbar">
            <div class="mini-materials">共 ${results.length} 个合并方案</div>
            <input id="schemeSearch" type="search" placeholder="搜索路线或材料，例如：硫磺晶体、钻石、龙鳞锭、城镇嘉奖令" />
          </div>
        `;

        outputEl.innerHTML = notice + renderList(results);
        bindSearch();
        bindAccordion();
      } catch (err) {
        statsEl.innerHTML = "";
        outputEl.innerHTML = `<div class="error">${err.message}</div>`;
        summaryEl.innerHTML = "计算失败，请检查配方是否存在循环。";
      }
    }

    function setupActiveTable() {
      activeData = TABLES[activeTableKey];
      activeRecipes = getCurrentRecipes();
      activeBaseMaterials = getCurrentBaseMaterials();

      panelTitleEl.textContent = "材料计算";
      aliasNoteEl.textContent = activeData.note;
      aliasNoteEl.style.display = activeData.note ? "" : "none";

      renderFactionOptions();
      renderTargetOptions();
      renderOwnedRows();
      renderFormulas();
      renderOutput();
    }

    document.querySelectorAll("[data-quick]").forEach(btn => {
      btn.addEventListener("click", () => {
        amountEl.value = btn.dataset.quick;
        renderOutput();
      });
    });

    factionEl.addEventListener("change", () => {
      saveOwnedRows();
      activeTableKey = factionEl.value;
      setupActiveTable();
    });

    targetEl.addEventListener("change", renderOutput);
    amountEl.addEventListener("input", renderOutput);

    ownedListEl.addEventListener("input", () => {
      saveOwnedRows();
      renderOutput();
    });

    ownedListEl.addEventListener("change", () => {
      saveOwnedRows();
      renderOutput();
    });

    ownedListEl.addEventListener("click", event => {
      if (!event.target.classList.contains("owned-remove")) return;
      saveOwnedRows();
      const row = event.target.closest(".owned-row");
      const index = Number(row?.dataset.index);
      const rows = ownedRowsByTable[activeTableKey] || [];
      rows.splice(index, 1);
      ownedRowsByTable[activeTableKey] = rows;
      renderOwnedRows();
      renderOutput();
    });

    addOwnedBtn.addEventListener("click", addOwnedRow);
    clearOwnedBtn.addEventListener("click", clearOwnedRows);

    setupActiveTable();
  </script>
</body>
</html>
